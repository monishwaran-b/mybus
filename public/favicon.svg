<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7067ff" />
      <stop offset="100%" stop-color="#26d9ff" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#141c2e" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect x="22" y="24" width="56" height="52" rx="10" fill="url(#busGrad)" />
  <!-- Windshield -->
  <rect x="28" y="30" width="44" height="22" rx="4" fill="#070b14" />
  <!-- Headlights -->
  <circle cx="33" cy="62" r="4" fill="#fff" />
  <circle cx="67" cy="62" r="4" fill="#fff" />
  <!-- Grille -->
  <line x1="42" y1="62" x2="58" y2="62" stroke="#26d9ff" stroke-width="2.5" stroke-linecap="round" />
  <!-- Wheels -->
  <circle cx="32" cy="76" r="6" fill="#0f172a" stroke="#7067ff" stroke-width="2" />
  <circle cx="68" cy="76" r="6" fill="#0f172a" stroke="#7067ff" stroke-width="2" />
  <!-- Radar Wave -->
  <path d="M 40 18 Q 50 12 60 18" fill="none" stroke="#26d9ff" stroke-width="2.5" stroke-linecap="round" />
</svg>
